<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do-List</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    
    <header>
        <div class="counter">
        <h2 class="taskcounter">Task
            <div class="taskNum">0</div>
        </h2> 
        
        <div class="completeCounter">
            <h2>Complete
                <div class="completeNum">0</div>
            </h2>
        </div>
        </div>
    </header>

    <div class="resetCon">
    <button class="Reset-btn">Reset</button>
    </div>

<div id="container">
    <div class="input-container">
        <input class="input-area" type="text" placeholder="Type your task.........">
        <button class="add-btn">Add Task</button>
    </div>
    <div class="tasks-container"></div>
</div>


    <script src="script.js"></script>
</body>
</html>
